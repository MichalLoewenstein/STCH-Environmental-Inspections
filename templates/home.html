<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>STCH Maintenance</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f6fa;

            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .card {
            background: white;
            padding: 50px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 55vh;
            height: 45vh;
        }

        h1 {
            margin-bottom: 10px;
        }

        p {
            color: #666;
            margin-bottom: 20px;
        }

        img {
            width: 180px;
            margin: 20px 0;
        }

        a {
            display: inline-block;
            padding: 12px 20px;
            background: #5a6cff;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

        a:hover {
            background: #3f52ff;
        }
    </style>
</head>

<body>

<div class="card">
    <h1>Hi, Welcome to STCH Maintenance</h1>
    <p>Scan the QR code or click below to open the form</p>

    <!-- ✅ QR CODE -->
    <img src="{{ url_for('static', filename='dispersants_qr.png') }}" alt="QR Code">

    <!-- ✅ BUTTON -->
    <div>
        <a href="/form">Open Paint Form</a>
        <a href="/boiler">Open Boiler Form</a>
    </div>
</div>

</body>
</html>
