<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Basic Paint Form</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='CSS/Formstyle.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>

<body>
    <form method="POST">
    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}
    
    <h2 class="form-title">Work Log Form</h2>
    
    <div class="input-group">
        <select name="company" required>
            <option value="" disabled selected hidden></option>
            <option value="Brown & Root">Brown & Root</option>
            <option value="Other">Other</option>
        </select>
        <label>Company</label>
    </div>

    <div class="input-group">
        <input type="text" name="name" required placeholder=" ">
        <label>Name*</label>
    </div>

    <div class="input-group">
        <input type="email" name="email" required placeholder=" ">
        <label>Email Address*</label>
    </div>

    <div class="input-group">
        <input type="tel" name="phone" required placeholder=" ">
        <label>Phone Number*</label>
    </div>

    <div class="input-group">
        <input type="text" id="location" name="location" placeholder=" ">
        <label>Location</label>
    </div>

    <div class="input-group">
        <input type="date" id="date" name="date">
        <label>Date</label>
    </div>

    <div class="input-group">
        <input type="time" id="start_time" name="start_time">
        <label>Start Time</label>
    </div>

    <div class="input-group">
        <input type="time" id="end_time" name="end_time">
        <label>End Time</label>
    </div>

    <div class="input-group">
        <input type="number" id="break" name="break" value="0">
        <label>Break (minutes)</label>
    </div>

    <div class="input-group">
        <input type="text" id="total_time" name="total_time" readonly placeholder=" ">
        <label>Total Time (hours)</label>
    </div>
    <div id="materials-container">
    <div class="row-group material-row">

        <!-- ✅ + BUTTON ON THE LEFT -->
        <div class="add-btn">
            <button type="button" onclick="addMaterial()">+</button>
        </div>

        <!-- ✅ Material -->
         <div class="field">
            <label>Material</label>
            <select name="material[]" onchange="checkOther(this)">
                <option disabled selected>Select material</option>
                {% for m in materialslist  %}
                <option value="{{ m }}">{{ m }}</option>
                {% endfor %}
                 <option value="Other">Other</option>
            </select>
            <input type="text"
           name="other_material[]"
           class="other-input"
           placeholder="Enter material name"
           style="display:none; margin-top:6px;">

        </div>

        <!-- ✅ Quantity -->
        <div class="field">
             <label>Quantity</label>
        <input type="number" name="quantity[]" required placeholder=" ">
       
        </div>

        <!-- ✅ Unit -->
        <div class="field">
              <label>Unit</label>
        <select name="measure[]" required>
            <option value="" disabled selected>Select unit</option>
            <option value="Gallons">Gallons</option>
            <option value="Pounds">Pounds</option>
        </select>
        
      
        </div>

        <!-- ✅ ✅ DELETE BUTTON -->
        <div class="delete">
        <button type="button" class="delete-btn" onclick="deleteMaterial(this)">
        <i class="fa-solid fa-trash"></i>
       </button>
        </div>
    </div>
</div>


    <button type="submit">Submit</button>

</form>
    
     <script>
    document.addEventListener("DOMContentLoaded", function () {
    let today = new Date().toISOString().split('T')[0];
    document.getElementById("date").value = today;

    
    function calculateTotalTime() {

    let start = document.getElementById("start_time").value;
    let end = document.getElementById("end_time").value;
    let breakTime = document.getElementById("break").value || 0;

    if (!start || !end) return;

    // Convert time to minutes
    let startParts = start.split(":");
    let endParts = end.split(":");

    let startMinutes = parseInt(startParts[0]) * 60 + parseInt(startParts[1]);
    let endMinutes = parseInt(endParts[0]) * 60 + parseInt(endParts[1]);

    // Handle overnight case
    if (endMinutes < startMinutes) {
        endMinutes += 24 * 60;
    }

    // Calculate total
    let totalMinutes = endMinutes - startMinutes - parseInt(breakTime);

    // Convert back to hours:minutes
    let hours = Math.floor(totalMinutes / 60);
    let minutes = totalMinutes % 60;

    document.getElementById("total_time").value =
        `${hours}:${minutes.toString().padStart(2, '0')}`;
}

// ✅ Trigger calculation when values change
document.getElementById("start_time").addEventListener("change", calculateTotalTime);
document.getElementById("end_time").addEventListener("change", calculateTotalTime);
document.getElementById("break").addEventListener("input", calculateTotalTime);

    });


   
let maxRows = 5;

function addMaterial() {
    let container = document.getElementById("materials-container");
    let rows = container.getElementsByClassName("material-row");
    let count = rows.length;

    if (count >= maxRows) {
        alert("Maximum 5 materials allowed");
        return;
    }

    let newRow = rows[0].cloneNode(true);

    // Clear values
    newRow.querySelectorAll("input").forEach(input => input.value = "");
    newRow.querySelectorAll("select").forEach(select => select.selectedIndex = 0);

    container.appendChild(newRow);

    updateAddButtons(); // ✅ important
}
function updateAddButtons() {
    let rows = document.querySelectorAll(".material-row");

    rows.forEach((row, index) => {
        let buttonDiv = row.querySelector(".add-btn");

        if (index === rows.length - 1) {
            buttonDiv.style.display = "visible"; // ✅ show only last
        } else {
            buttonDiv.style.display = "hidden"; // ✅ hide others
        }
    });
}
function deleteMaterial(button) {
    let rows = document.querySelectorAll(".material-row");

    if (rows.length <= 1) {
        alert("At least one material is required");
        return;
    }

    button.closest(".material-row").remove();

    updateAddButtons(); // ✅ keep your + button logic correct
}

function checkOther(selectElement) {
    let container = selectElement.closest(".field");
    let input = container.querySelector(".other-input");

    if (selectElement.value === "Other") {
        input.style.display = "block";   // ✅ show input
        input.required = true;
    } else {
        input.style.display = "none";    // ✅ hide input
        input.required = false;
        input.value = "";
    }
}

    </script>

</body>
</html>
