<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flare Inspection Form</title>



<style>
html { visibility: hidden; }
</style>


<script>
(function () {
    const nav = performance.getEntriesByType("navigation")[0];

    if (nav && nav.type === "back_forward") {
        window.location.replace("/");
    } else {
        document.documentElement.style.visibility = "visible";
    }
})();
</script>
    

    <link rel="stylesheet" href="{{ url_for('static', filename='css/BoilerForm.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/CEB_Flare.css') }}">
    <script src="{{ url_for('static', filename='js/boilerform.js')}}" defer></script>
    

</head>

<body>

<form method="POST" autocomplete="off">

    <h1 class="form-title">Flare / CEB Inspection Form</h1>
     <br>
    <!-- ===================================================== -->
    <!-- ✅ TIME SELECTION -->
    <!-- ===================================================== -->
    <div class="input-row">
        <label>Date</label>
        <input type="date" id="date" name="date">
    </div>
    <div class="input-row">
    <label>Inspection Time</label>

    <div class="time-options">
     

        <input type="radio" id="t2" name="time" value="10:00">
        <label for="t2" class="time-box">10:00</label>

        <input type="radio" id="t3" name="time" value="16:00">
        <label for="t3" class="time-box">16:00</label>

        <input type="radio" id="t4" name="time" value="22:00">
        <label for="t4" class="time-box">22:00</label>

           <input type="radio" id="t1" name="time" value="4:00" required>
        <label for="t1" class="time-box">4:00</label>
    </div>
    <div id="autoSelectMsg"></div>
</div>
 <div class="input-row">
        <label>Operator*</label>
        <input type="text" name="operator" required>
    </div>
    <!-- ===================================================== -->
    <!-- ✅ PRESSURE / MEASUREMENTS -->
    <!-- ===================================================== -->

     <!--<h3>Pressure / Measurement Readings</h3>-->
    <div class="sub-header">Ground Flare Only</div>

    <div class="input-row">
        <label>SP-1 (Inches)</label>
        <input type="number" min="0" name="sp1" >   
    </div>

    <div class="input-row">
        <label>SP-2 (Inches)</label>
        <input type="number" min="0" name="sp2" >
    </div>

    <div class="input-row">
        <label>KP-1 (Inches)</label>
        <input type="number" min="0" name="kp1" >  
    </div>

    <div class="input-row">
        <label>Pilot Gas Pressure (PSIG)</label>
        <input type="number" min="0" name="pilot_gas_pressure" >  
    </div>

    <div class="input-row">
        <label>Supplemental NG Flow (SCFM)</label>
        <input type="number" min="0" name="supplemental_ng_flow1" >  
    </div>


    <!-- ===================================================== -->
    <!-- ✅ FLAME VISIBILITY -->
    <!-- ===================================================== -->

    <div class="input-row">
        <label>Main flame visible?</label>
        <select name="main_flame_visible">
            <option disabled selected hidden></option>
            <option>Yes</option>
            <option>No</option>
        </select>
    </div>

    <div class="input-row">
        <label>Pilot flame visible?</label>
        <select name="pilot_flame_visible">
            <option disabled selected hidden></option>
            <option>Yes</option>
            <option>No</option>
        </select>
    </div>


    <!-- ===================================================== -->
    <!-- ✅ WASTE GAS -->
    <!-- ===================================================== -->

   <!-- <div class="sub-header">Waste Gas</div> -->

    <div class="input-row"> 
        <label>Waste Gas Flow (SCFM)</label>
        <input type="number" min="0" name="waste_gas_flow" >   
    </div>
    <div class="input-row">
        <label>Waste Gas Temperature (&deg;F):</label>
        <input type="number" min="0"name="waste_gas_temp" >
    </div>


    <div class="sub-header">Table</div>

<br>


<div class="table-container">
  <table class="responsive-table">
    <thead>
      <tr>
        <th>Waste Gas Flow (SCFM)</th>
        <th>Supplemental NG Flow</th>
      </tr>
    </thead>
    <tbody>
      <tr><td>25</td><td>6.45</td></tr>
      <tr><td>50</td><td>12.9</td></tr>
      <tr><td>75</td><td>19.3</td></tr>
      <tr><td>100</td><td>25.8</td></tr>
      <tr><td>125</td><td>32.2</td></tr>
      <tr><td>150</td><td>38.7</td></tr>
      <tr><td>175</td><td>45.1</td></tr>
      <tr><td>200</td><td>51.6</td></tr>
    </tbody>
  </table>
</div>


<div class="sub-header">CEB Only</div>

<div class="input-row">
    <label>CEB On/Off</label>
        <select name="CEBchoice" required>
            <option value="" disabled selected hidden></option>
            <option value="on">On</option>
            <option value="off">Off</option>
        </select>
        
    </div>


   <div class="input-row">
        <label>Supplemental NG Flow (SCFM)</label>
        <input type="number" min="0" name="supplemental_ng_flow2" >   
    </div>


    <div class="input-row">
        <label>Stack Temperature (&deg;F)</label>
        <input type="number" min="0" name="stacktemperature" >
        
    </div>

   
<div class="input-row">
    <label>Is maintenance complete?</label>
        <select name="maintaincomplete" required>
            <option value="" disabled selected hidden></option>
            <option value="Yes">Yes</option>
            <option value="No">No</option>
        </select>
        
    </div>

    <div class="sub-header">Infrastructre Support Supervisor Inspections</div>

    <div class="input-row">
    <label>Flare Visible Emissions?</label>
        <select name="flarevisemission" required>
            <option value="" disabled selected hidden></option>
            <option value="Yes">Yes</option>
            <option value="No">No</option>
        </select>
        
    </div>

    <div class="input-row">
    <label>CEB Visible Emissions?</label>
        <select name="CEBvisemission" required>
            <option value="" disabled selected hidden></option>
            <option value="Yes">Yes</option>
            <option value="No">No</option>
        </select>
        
    </div>
    <div class="sub-header">Comments</div>
    <br>
    <label class="Comments">When Off-Line call EO Unit to find out their status 9-281-544-7371 (4-7371)
        Call Gas Sampling Company When the CEB is Down
        ARI Environmental, Inc. 713-946-6222</label>
      

 <div class="input-row full-width">
        <!-- <label>Comments:</label> -->
        <textarea name="comments" placeholder="Comments"></textarea>
    </div>
    <br>
    <button type="submit">Submit</button>
    <div class="button">
    <a href="/home">Cancel</a></div>
</form>
